apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c-web-socket-server.fullname" . }}
  labels:
    {{- include "c-web-socket-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "c-web-socket-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "c-web-socket-server.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: c-web-socket-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: tcp-chat
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: tcp-chat
          livenessProbe:
            tcpSocket:
              port: tcp-chat
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
